name: Deploy

# Publishes the bundle the build job produced - downloaded from that run, not
# rebuilt here, so what goes live is exactly what was tested. Triggered by the
# Tests workflow rather than by a push, which is what makes "after the build
# job passes" true by construction: a red build never reaches this file.
#
# A push to main publishes to the project's production branch. Everything else
# that passed Tests publishes a *preview* instead: one per pull request
# (pr-<number>), or one per branch when a branch is pushed without a PR. A
# preview lands on its own <alias>.<project>.pages.dev URL and never touches the
# production one, so a change can be looked at before it is merged.
#
# Previews are built from the pull request's code (the Tests run checked it out)
# and published with this repository's credentials, so a fork's PR does get its
# output hosted - on a URL of its own, not on the site's.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

concurrency:
  # One deploy at a time per ref. A newer push to the same pull request makes the
  # older preview pointless; a production publish is never cut off halfway.
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions:
  contents: read
  # Required to fetch the artifact from the Tests run that triggered this.
  actions: read
  # Required to put the preview link where a reviewer will see it.
  pull-requests: write

jobs:
  deploy:
    name: Cloudflare Pages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      # Only the default branch publishes the real site; every other run is a
      # preview, which is also where its URL is reported on the pull request.
      name: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - name: Work out where this publishes
        id: target
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$HEAD_BRANCH" = "main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_NUMBER" ]; then
            # Stable per pull request, so the URL survives new commits.
            echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "label=preview for #$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # A branch pushed without a PR still gets somewhere to look.
            echo "branch=$(echo "$HEAD_BRANCH" | tr '/' '-')" >> "$GITHUB_OUTPUT"
            echo "label=preview for $HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      # Publishing is the only thing here that needs a credential, and a
      # repository without Cloudflare secrets is a normal state: the burn-in,
      # the suite and every other job run without them. Their absence therefore
      # skips this job with a notice rather than failing a run whose reason for
      # existing was something else (a green Tests run for a branch that only
      # wanted its crypto burn-in checked, for instance).
      #
      # A step's `if:` cannot read `secrets` directly, so the answer is decided
      # once here and carried forward as an output.
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LABEL: ${{ steps.target.outputs.label }}
        run: |
          missing=''
          if [ -z "$API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy skipped ($LABEL): no Cloudflare credentials in this repository (missing:$missing). Add both secrets to publish."
          {
            echo "### Deploy skipped ($LABEL)"
            echo
            echo "Nothing was published: this repository has no Cloudflare credentials (missing:$missing). Add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` as repository or environment secrets and the next green Tests run will publish. Everything else that ran is unaffected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the bundle Tests built
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Cloudflare Pages serves index.html for unmatched paths only when there
      # is no 404.html, which is easy to lose. Saying it out loud keeps deep
      # links such as /orders/order_… working on a refresh.
      - name: Route client-side URLs to the app
        if: steps.credentials.outputs.configured == 'true'
        run: |
          test -f build/index.html || { echo "::error::the artifact has no index.html"; exit 1; }
          printf '/*    /index.html   200\n' > build/_redirects

      # The bundle bakes its API origin in at build time, so an unset variable
      # publishes a site whose every request goes to localhost. That is allowed
      # on purpose; it is not allowed to happen quietly.
      #
      # The rule matches the one the build job used: main gets the production
      # API, a preview gets the preview API. Nothing here can change what is in
      # the artifact - this only reports it, so a wrong variable is visible.
      - name: Say which API this bundle was built against
        id: api
        env:
          ON_MAIN: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
          PRODUCTION_API: ${{ vars.REACT_APP_BACKEND_URL }}
          PREVIEW_API: ${{ vars.PREVIEW_BACKEND_URL }}
        run: |
          if [ "$ON_MAIN" = "true" ]; then
            origin="$PRODUCTION_API"; role=production; variable=REACT_APP_BACKEND_URL
          else
            origin="$PREVIEW_API"; role=preview; variable=PREVIEW_BACKEND_URL
          fi

          if [ -z "$origin" ]; then
            echo "::warning::No $role API origin is configured (repository variable $variable), so this bundle talks to http://localhost:8000 and cannot reach an API. Set it and rerun Tests."
          else
            echo "Bundle built against $origin ($role)"
          fi

          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # The origin is inlined at build time, so a bundle built before the variable
      # was set still says localhost - and it would publish quite happily, giving
      # a site that loads and cannot reach an API. The artifact is the one Tests
      # uploaded, so the comparison is against what *this* workflow believes the
      # build used: a disagreement means the artifact is from an older run, and
      # the fix is another Tests run, not a deploy.
      #
      # It reads the JavaScript, not index.html: CRA keeps the origin in the entry
      # chunk and links it from the HTML relatively, so index.html never mentions
      # it. Verified against a real build, where the string appears 21 times in
      # main.<hash>.js and zero times in index.html.
      - name: Check the bundle was built against this API
        id: bundle
        if: steps.credentials.outputs.configured == 'true'
        env:
          EXPECTED: ${{ steps.api.outputs.origin }}
          ROLE: ${{ steps.api.outputs.role }}
        run: |
          target=$(printf '%s' "$EXPECTED" | sed 's:/*$::')

          if [ -z "$target" ]; then
            echo "::warning title=Nothing to compare::No $ROLE API origin is configured, so this bundle is expected to talk to http://localhost:8000 and there is nothing to check it against. Set the variable and re-run Tests."
            exit 0
          fi

          if grep -rqF --include='*.js' -- "$target" build/static/js; then
            echo "The bundle references $target"
            exit 0
          fi

          # Say what it does reference: the answer is nearly always localhost, or
          # the other environment's API.
          found=$(grep -rhoE --include='*.js' 'https?://[a-zA-Z0-9._-]+(:[0-9]+)?' build/static/js \
            | sort | uniq -c | sort -rn | head -5)

          echo "::error title=The bundle was not built for $target::Nothing in this artifact's JavaScript mentions the $ROLE API origin '$target', so publishing it would put a site online whose every request goes somewhere else - usually http://localhost:8000 from a build that ran before the variable was set. Re-run Tests so the build picks the variable up, then let the deploy that follows publish its artifact."
          echo "absolute origins in the bundle (count):"
          echo "${found:-(none)}"
          exit 1
      # A project that was never created is the most common first-deploy failure,
      # and `wrangler pages deploy` reports it as a 404 inside its own output,
      # which reads like a credentials problem and takes a session to look at.
      # Asking Cloudflare first turns it into one sentence naming the project and
      # the command that creates it.
      #
      # Only the answers that are certain are errors: 404 means the project is
      # not there, 401/403 means the token cannot see it. A 5xx, a proxy or a body
      # that is not the API's is a warning - `wrangler pages deploy` is the thing
      # that actually knows, and failing on our own uncertainty would be worse
      # than letting it speak.
      - name: Check the Pages project exists
        id: project
        if: steps.credentials.outputs.configured == 'true'
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The same name the publish step uses; drift here would check one
          # project and deploy to another.
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
          LABEL: ${{ steps.target.outputs.label }}
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT

          code=$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT"
          ) || code=000

          detail=$(head -c 300 "$body" 2>/dev/null || true)

          case "$code" in
            200)
              # The project's own production branch is what decides whether
              # `--branch=main` publishes the site or quietly creates a preview
              # that never reaches it. That is invisible in the run - the upload
              # succeeds either way - so it is checked here, and only for a
              # production deploy: a preview is meant to use its own branch.
              #
              # Nothing is concluded when the field cannot be read: an empty
              # answer means "no opinion", never "fine".
              read_branch='import json,sys; print(json.load(sys.stdin)["result"]["production_branch"])'
              branch=$(python3 -c "$read_branch" < "$body" 2>/dev/null || true)
              echo "Pages project $PROJECT exists (production branch: ${branch:-unreadable})"

              if [ "$LABEL" = "production" ] && [ -n "$branch" ] && [ "$branch" != "main" ]; then
                echo "::warning title=The Pages project publishes from '$branch', not main::Project '$PROJECT' has production branch '$branch', but this workflow deploys with --branch=main. The upload succeeds and lands as a preview, so the real site never updates. Change the project's production branch to main in Cloudflare rather than editing this workflow."
              fi
              ;;
            404)
              echo "::error title=No Pages project named $PROJECT::Cloudflare has no Pages project '$PROJECT' in account $ACCOUNT_ID, so there is nowhere to publish $LABEL. Create it (wrangler pages project create $PROJECT --production-branch=main) or point the repository variable CLOUDFLARE_PAGES_PROJECT at the project you meant."
              echo "response: $detail"
              exit 1
              ;;
            401|403)
              echo "::error title=Cloudflare rejected the token::The Pages API answered $code for project '$PROJECT'. CLOUDFLARE_API_TOKEN needs the Cloudflare Pages: Edit permission on account $ACCOUNT_ID - a token that cannot see the project cannot publish to it either."
              echo "response: $detail"
              exit 1
              ;;
            000)
              echo "::warning title=Could not check the Pages project::The Pages API could not be reached, so whether '$PROJECT' exists is unknown. Leaving it to wrangler."
              ;;
            *)
              echo "::warning title=Could not check the Pages project::The Pages API answered $code, so whether '$PROJECT' exists is unknown. Leaving it to wrangler."
              echo "response: $detail"
              ;;
          esac

      - name: Publish
        id: publish
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Pages project must already exist (Cloudflare dashboard, or
          # `wrangler pages project create`). Its name comes from the repository
          # variable, falling back to the repository's own name. Any --branch
          # other than the project's production branch is a preview deployment.
          command: >-
            pages deploy build
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
            --branch=${{ steps.target.outputs.branch }}

      # A preview nobody can find is not reviewed, and the deployment this job
      # records is attached to the default branch, not to the pull request. So
      # the link goes on the PR itself: one comment, rewritten in place on each
      # push rather than one per commit.
      #
      # Not `gh pr comment --edit-last`: that edits the *last* comment of the
      # token's user, which is only ours by luck. The marker decides instead.
      - name: Put the preview link on the pull request
        if: github.event.workflow_run.event == 'pull_request' && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_URL: ${{ steps.publish.outputs['pages-deployment-alias-url'] || steps.publish.outputs.deployment-url }}
        run: |
          marker='<!-- pages-preview -->'
          body="$marker
          Preview of ${HEAD_SHA:0:7}: $PREVIEW_URL"

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1 || true)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

      # The run page is where someone looks when a deploy is mentioned in review,
      # so the URL belongs there rather than buried in the wrangler output.
      - name: Report the URL
        if: always() && steps.publish.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.publish.outputs['pages-deployment-alias-url'] }}
          LABEL: ${{ steps.target.outputs.label }}
        run: |
          {
            echo "### Published $LABEL"
            echo
            echo "- Deployment: $DEPLOYMENT_URL"
            if [ -n "$ALIAS_URL" ]; then
              echo "- Alias (stable for this branch): $ALIAS_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published $LABEL at $DEPLOYMENT_URL"
